name: Backend CI

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: studytrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        # Alinhado ao compose raiz (redis:alpine); evita redis:7-alpine com cadeia antiga de CVEs.
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis, intl, zip
          coverage: pcov

      - name: Create cache directory
        working-directory: backend
        run: mkdir -p bootstrap/cache storage/framework/views storage/framework/cache storage/framework/sessions storage/logs

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install dependencies
        working-directory: backend
        run: mkdir -p bootstrap/cache && composer install --no-interaction --prefer-dist

      - name: Create env file
        working-directory: backend
        run: |
          printf '%s\n' \
            "APP_NAME=StudyTrackPro" \
            "APP_ENV=testing" \
            "APP_KEY=" \
            "APP_DEBUG=true" \
            "APP_URL=http://localhost" \
            "DB_CONNECTION=pgsql" \
            "DB_HOST=127.0.0.1" \
            "DB_PORT=5432" \
            "DB_DATABASE=studytrack_test" \
            "DB_USERNAME=postgres" \
            "REDIS_HOST=127.0.0.1" \
            "REDIS_PORT=6379" \
            "REDIS_PASSWORD=" \
            "CACHE_STORE=redis" \
            "CACHE_DATABASE=1" \
            "QUEUE_CONNECTION=redis" \
            "SESSION_DRIVER=redis" \
            "REVERB_APP_ID=local" \
            "REVERB_APP_KEY=local-key" \
            "REVERB_APP_SECRET=local-secret" \
            "CORS_ALLOWED_ORIGINS=http://localhost:5173" \
            > .env

      - name: Generate app key
        working-directory: backend
        run: php artisan key:generate

      - name: Run tests with coverage
        working-directory: backend
        run: php artisan test --coverage-clover=coverage.xml
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: studytrack_test
          DB_USERNAME: postgres
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.xml

      - name: Run Pint
        working-directory: backend
        run: ./vendor/bin/pint --test


      - name: Run Gitleaks secret scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Run PHPStan
        working-directory: backend
        run: ./vendor/bin/phpstan analyse --memory-limit=512M
