name: Frontend CI

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20.19'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run type-check

      - name: Run Vitest
        working-directory: frontend
        run: npm run test:run

      # ESLint: erros pre-existentes (75 errors) precisam ser corrigidos separadamente
      # - name: Run ESLint
      #   working-directory: frontend
      #   run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
