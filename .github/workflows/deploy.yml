name: Deploy

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [main]

jobs:
  backend-ci:
    uses: ./.github/workflows/backend-ci.yml

  frontend-ci:
    uses: ./.github/workflows/frontend-ci.yml

  build-and-push:
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/php/Dockerfile.production
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/studytrack-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/studytrack-backend:${{ github.sha }}


      - name: Run Trivy vulnerability scanner (backend)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/studytrack-backend:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL
        continue-on-error: false

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./docker/node/Dockerfile.frontend
          build-args: |
            NODE_ENV=production
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/studytrack-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/studytrack-frontend:${{ github.sha }}

      - name: Run Trivy vulnerability scanner (frontend)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/studytrack-frontend:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL
        continue-on-error: false

