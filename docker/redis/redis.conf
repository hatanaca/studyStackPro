# Redis configuration — password set via REDIS_PASSWORD env at startup

bind 0.0.0.0
protected-mode yes
port 6379
# Protecao: requirepass e injetado via entrypoint.sh usando REDIS_PASSWORD do .env

tcp-keepalive 300
timeout 0
maxclients 10000

maxmemory 512mb
maxmemory-policy allkeys-lru

# Persistência RDB desabilitada — cache e filas Redis são regeneráveis.
# Se precisar de snapshot, use save "900 1" em um override de produção.
save ""

# AOF (Append-Only File): fsync a cada 1s — perda máxima de 1s em crash.
# Dados críticos: blacklist de tokens, filas Horizon. Cache regera automaticamente.
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

loglevel notice
logfile ""

# Slow log: queries taking >10ms
slowlog-log-slower-than 10000
slowlog-max-len 128
